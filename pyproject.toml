[project]
name = "career-transition-map-api"
version = "0.1.0"
description = "API and reproducible data pipeline for Career Transition Map"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic", "polars", "duckdb", "pyarrow", "openpyxl", "typer", "rich"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
